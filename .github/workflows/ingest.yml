name: ingest-news

# Pulls RSS feeds every hour and stores articles as JSON on the `data`
# branch (data/{lang}/latest.json). No external database — GitHub only.
# Uses the automatic GITHUB_TOKEN, no secrets needed.
#
# Hourly cadence ≈ 1,080 Actions minutes/month — inside the 2,000 min/month
# free quota for PRIVATE repos. (Every 15 min would need ≈4,300 min/month,
# which exceeds the free quota unless the repo is public.)
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun scripts/ingest.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: enables AI article generation. When the secret is missing it
          # resolves to an empty string and ingest skips generation gracefully.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
