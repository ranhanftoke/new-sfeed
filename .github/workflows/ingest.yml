name: ingest-news

# Pulls RSS feeds every 15 minutes and stores articles in Postgres.
# Requires the DATABASE_URL secret (Supabase/Neon connection string):
#   Repo Settings → Secrets and variables → Actions → New repository secret
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun scripts/ingest.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
